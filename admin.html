<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ================================= -->
    <!-- SECURITY SETTINGS -->
    <!-- ================================= -->

    <meta
    http-equiv="Content-Security-Policy"
    content="
    default-src 'self';
    img-src 'self' https:;
    style-src 'self' 'unsafe-inline';
    script-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    ">

    <meta
    http-equiv="X-Frame-Options"
    content="DENY"
    >

    <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
    >

    <meta
    http-equiv="Permissions-Policy"
    content="
    geolocation=(),
    microphone=(),
    camera=()
    ">

    <!-- ================================= -->
    <!-- META -->
    <!-- ================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        Secure Admin Dashboard

    </title>

    <!-- ================================= -->
    <!-- CSS -->
    <!-- ================================= -->

    <link
        rel="stylesheet"
        href="admin.css"
    >

    <!-- ================================= -->
    <!-- JS -->
    <!-- ================================= -->

    <script
        defer
        src="app.js"
    ></script>

    <script
        defer
        src="admin.js"
    ></script>

</head>

<body>

    <!-- ================================= -->
    <!-- LOGIN SCREEN -->
    <!-- ================================= -->

    <div
        class="login-screen"
        id="loginScreen"
    >

        <div class="login-box">

            <h1>

                Admin Access

            </h1>

            <p class="subtitle">

                Secure Analytics Control Panel

            </p>

            <input
                type="password"
                id="passkey"
                placeholder="Enter Passkey"
                autocomplete="off"
            >

            <button id="loginButton">
                Enter
            </button>

            <p
                class="security-warning"
                id="securityWarning"
            >

            </p>

        </div>

    </div>

    <!-- ================================= -->
    <!-- DASHBOARD -->
    <!-- ================================= -->

    <div
        class="dashboard"
        id="dashboard"
        style="display: none;"
    >

        <!-- HEADER -->

        <div class="dashboard-header">

            <div>

                <h1>

                    Website Analytics

                </h1>

                <p class="dashboard-subtitle">

                    Advanced Tracking & Monitoring

                </p>

            </div>

            <div class="dashboard-buttons">

                <button
                    id="resetButton"
                    class="clear-button"
                >

                    Reset Analytics

                </button>

                <button
                    id="exportButton"
                    class="export-button"
                >

                    Export Analytics

                </button>

                <button
                    id="logoutButton"
                    class="logout-button"
                >

                    Logout

                </button>

            </div>

        </div>

        <!-- ================================= -->
        <!-- ANALYTICS GRID -->
        <!-- ================================= -->

        <div class="analytics-grid">

            <!-- TOTAL VISITS -->

            <div class="analytics-card">

                <h2>

                    Total Visits

                </h2>

                <p id="visits">

                    0

                </p>

            </div>

            <!-- READING TIME -->

            <div class="analytics-card">

                <h2>

                    Reading Time

                </h2>

                <p id="readingTime">

                    0 Minutes

                </p>

            </div>

            <!-- ACTIVE USERS -->

            <div class="analytics-card">

                <h2>

                    Active Users

                </h2>

                <p id="activeUsers">

                    0

                </p>

            </div>

            <!-- DEVICE -->

            <div class="analytics-card">

                <h2>

                    Last Device

                </h2>

                <p id="device">

                    Unknown

                </p>

            </div>

            <!-- LAST VISIT -->

            <div class="analytics-card">

                <h2>

                    Last Visit

                </h2>

                <p id="lastVisit">

                    None

                </p>

            </div>

            <!-- ADMIN SESSIONS -->

            <div class="analytics-card">

                <h2>

                    Admin Sessions

                </h2>

                <p id="adminSessions">

                    0

                </p>

            </div>

            <!-- FAILED ATTEMPTS -->

            <div class="analytics-card">

                <h2>

                    Failed Logins

                </h2>

                <p id="failedAttempts">

                    0

                </p>

            </div>

            <!-- TOP DOWNLOAD -->

            <div class="analytics-card">

                <h2>

                    Top Download

                </h2>

                <p id="topDownload">

                    None

                </p>

            </div>

            <!-- DOWNLOADS -->

            <div class="analytics-card large-card">

                <h2>

                    Downloads

                </h2>

                <div id="downloads">

                </div>

            </div>

            <!-- DAILY VISITS -->

            <div class="analytics-card large-card">

                <h2>

                    Daily Visits

                </h2>

                <div id="dailyVisits">

                </div>

            </div>

            <!-- BROWSER -->

            <div class="analytics-card large-card">

                <h2>

                    Browser Info

                </h2>

                <div id="browser">

                </div>

            </div>

        </div>

    </div>

</body>

</html>
