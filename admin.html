<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ================================= -->
    <!-- SECURITY SETTINGS -->
    <!-- ================================= -->

    <meta
    http-equiv="Content-Security-Policy"
    content="
    default-src 'self';
    img-src 'self' https:;
    style-src 'self' 'unsafe-inline';
    script-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    ">

    <meta
    http-equiv="X-Frame-Options"
    content="DENY"
    >

    <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
    >

    <meta
    http-equiv="Permissions-Policy"
    content="
    geolocation=(),
    microphone=(),
    camera=()
    ">

    <!-- ================================= -->
    <!-- META -->
    <!-- ================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        Secure Admin Dashboard

    </title>

    <!-- ================================= -->
    <!-- CSS -->
    <!-- ================================= -->

    <link
        rel="stylesheet"
        href="admin.css"
    >

    <!-- ================================= -->
    <!-- JS -->
    <!-- ================================= -->

    <script
        defer
        src="admin.js"
    ></script>

</head>

<body>

    <!-- ================================= -->
    <!-- LOGIN SCREEN -->
    <!-- ================================= -->

    <div
        class="login-screen"
        id="loginScreen"
    >

        <h1>

            Admin Access

        </h1>

        <input
            type="password"
            id="passkey"
            placeholder="Enter Passkey"
            autocomplete="off"
        >

        <button onclick="login()">

            Enter

        </button>

    </div>

    <!-- ================================= -->
    <!-- DASHBOARD -->
    <!-- ================================= -->

    <div
        class="dashboard"
        id="dashboard"
        style="display: none;"
    >

        <h1>

            Website Analytics

        </h1>

        <!-- LOGOUT BUTTON -->

        <button
            onclick="logout()"
            class="logout-button"
        >

            Logout

        </button>

        <!-- ================================= -->
        <!-- ANALYTICS GRID -->
        <!-- ================================= -->

        <div class="analytics-grid">

            <!-- VISITS -->

            <div class="analytics-card">

                <h2>

                    Total Visits

                </h2>

                <p id="visits">

                    0

                </p>

            </div>

            <!-- READING TIME -->

            <div class="analytics-card">

                <h2>

                    Total Reading Time

                </h2>

                <p id="readingTime">

                    0 Minutes

                </p>

            </div>

            <!-- DOWNLOADS -->

            <div class="analytics-card">

                <h2>

                    Downloads

                </h2>

                <div id="downloads">

                </div>

            </div>

        </div>

    </div>

</body>

</html>
